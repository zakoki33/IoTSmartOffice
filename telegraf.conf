# ========================================
# Telegraf Agent
# ========================================

[agent]
  interval = "2s"
  flush_interval = "2s"


# ========================================
# MQTT Input - Temperature
# ========================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["home/room/temperature"]
  client_id = "telegraf_temperature"
  data_format = "value"
  data_type = "float"
  name_override = "esp32_dht11"

  [inputs.mqtt_consumer.tags]
    sensor = "temperature"


# ========================================
# MQTT Input - Humidity
# ========================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["home/room/humidity"]
  client_id = "telegraf_humidity"
  data_format = "value"
  data_type = "float"
  name_override = "esp32_dht11"

  [inputs.mqtt_consumer.tags]
    sensor = "humidity"


# ========================================
# InfluxDB Output
# ========================================

[[outputs.influxdb_v2]]
  urls = ["http://influxdb2:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "40844d1862e29047"
  bucket = "iot_data"